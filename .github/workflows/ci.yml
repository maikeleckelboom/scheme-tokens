name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the `engines` floor, 24 is Active LTS, 26 is Current.
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: false

      - name: Report toolchain
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm release:check` is the local umbrella for everything below. CI runs
      # the same gates as named steps so a failure points at one contract, and
      # so the expensive pack-based checks each run exactly once.
      - name: Validate
        run: pnpm validate

      - name: Material 3 release gates (engine + packed artifacts + consumers)
        run: pnpm release:material3:gates

      - name: Publish lint (publint + attw on npm pack output)
        run: pnpm package:check

      - name: Packed consumer smoke
        run: pnpm smoke:consumer

      - name: Packed consumer module resolution (bundler + node16)
        run: pnpm check:module-resolution

      - name: Packed theme coordinate consumer
        run: pnpm check:theme-coordinate-consumer

      - name: Tarball contents
        run: pnpm check:tarball

      - name: Documentation
        run: pnpm docs:check

      - name: External packed consumer audit
        run: pnpm audit:external-consumer

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The changeset gate diffs the branch against its merge base, so it
          # needs history rather than a single-commit checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: false

      - name: Report toolchain
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: API surface snapshot is current
        run: pnpm api:check

      - name: API surface drift has a changeset
        run: pnpm check:changeset
